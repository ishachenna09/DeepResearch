name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Import-time settings only. Nothing here connects: the unit tests are
      # pure, and the eval gate reads recorded fixtures.
      SECRET_KEY: ci-not-a-secret
      APP_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci
      REDIS_URL: redis://127.0.0.1:6379/0
      LITELLM_MASTER_KEY: sk-ci
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      # The limiter is a production control; unit tests construct their own.
      RATE_LIMIT_ENABLED: "false"
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt

      - name: Tests (no network, no LLM)
        run: pytest api/tests -q

      - name: Eval gate (recorded artifacts)
        run: python evals/run_evals.py

      - name: Keep the eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-latest
          path: evals/results/latest.json
          if-no-files-found: ignore
